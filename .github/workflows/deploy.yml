name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Verify build & deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The VPS serves the committed dist/ files, not this runner's build.
      - name: Verify committed production build
        run: |
          node --check dist/index.cjs
          node <<'NODE'
          const fs = require("node:fs");
          for (const file of ["dist/index.cjs", "dist/public/index.html"]) {
            if (!fs.statSync(file).isFile() || fs.statSync(file).size === 0) {
              throw new Error(`Missing or empty production file: ${file}`);
            }
          }
          const html = fs.readFileSync("dist/public/index.html", "utf8");
          const assets = [...html.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)];
          if (assets.length === 0) throw new Error("No production assets found");
          for (const [, asset] of assets) {
            if (!fs.statSync(`dist/public${asset}`).isFile()) {
              throw new Error(`Missing production asset: ${asset}`);
            }
          }
          console.log(`Verified production build and ${assets.length} entry assets`);
          NODE

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/brightboardapp.com
            git fetch origin main
            git reset --hard origin/main
            mkdir -p /var/log/brightboard
            pm2 restart brightboard 2>/dev/null || \
              pm2 start ecosystem.config.cjs
            pm2 save
            echo "✅ Deployed at $(date)"
